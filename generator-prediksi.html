<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System V.2.1 - Command Center</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
:root{
    --royal:#0A2D88;
    --royal2:#0B3C7A;
    --navy:#07152F;
    --navy2:#020611;

    --electric:#007BFF;
    --electric2:#00AFFF;
    --cyan:#22D3FF;

    --white:#FFFFFF;
    --muted:#91A9D5;

    --danger:#ff4545;
    --success:#00e676;

    --card:rgba(7,28,82,.58);
    --card2:rgba(5,20,48,.82);

    --border:rgba(0,174,255,.28);

    --shadow:
        0 15px 40px rgba(0,0,0,.45),
        0 0 25px rgba(0,123,255,.08);
}

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(0,123,255,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(10,45,136,.30),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #020611 0%,
            #061536 45%,
            #03102A 70%,
            #020611 100%
        );

    color:var(--white);
    font-family:'Rajdhani',sans-serif;
    overflow:hidden;
}

/* =========================
   MAIN
========================= */

.main-wrapper{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* =========================
   HEADER
========================= */

.fixed-header{
    flex-shrink:0;
    padding:22px 25px 25px;
    position:relative;
    z-index:100;

    background:
        linear-gradient(
            to bottom,
            rgba(2,6,17,.98),
            rgba(2,6,17,.90),
            transparent
        );
}

h1{
    font-family:'Orbitron',sans-serif;
    font-size:28px;
    font-weight:800;
    text-align:center;

    letter-spacing:4px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            var(--electric2),
            #ffffff,
            var(--electric)
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:titleShine 5s linear infinite;

    margin-bottom:25px;

    text-shadow:
        0 0 20px rgba(0,174,255,.25);
}

@keyframes titleShine{
    to{
        background-position:300% center;
    }
}

h1::after{
    content:"";
    display:block;

    width:min(700px,80%);
    height:2px;

    margin:18px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--electric2),
            transparent
        );

    box-shadow:
        0 0 12px rgba(0,174,255,.8);
}

/* =========================
   TOP CONTROLS
========================= */

.top-row{
    width:100%;
    max-width:1400px;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:12px;
    flex-wrap:wrap;
}

.search-box{
    width:220px;
    height:38px;

    padding:0 16px;

    border-radius:10px;

    outline:none;

    border:1px solid rgba(0,174,255,.45);

    background:
        linear-gradient(
            135deg,
            rgba(7,28,82,.75),
            rgba(2,10,25,.9)
        );

    color:white;

    font-family:'Rajdhani',sans-serif;
    font-size:14px;
    font-weight:700;

    letter-spacing:1px;

    transition:.3s;
}

.search-box::placeholder{
    color:#7191C7;
}

.search-box:focus{
    border-color:var(--electric2);

    box-shadow:
        0 0 0 2px rgba(0,174,255,.08),
        0 0 20px rgba(0,174,255,.22);
}

/* =========================
   HEADER BUTTONS
========================= */

.btn-copy-all,
.view-toggle-btn,
.add-market-btn{
    height:38px;

    padding:0 20px;

    border:none;
    border-radius:10px;

    font-family:'Orbitron',sans-serif;
    font-size:11px;
    font-weight:700;

    color:white;

    cursor:pointer;

    letter-spacing:.5px;

    transition:.3s;

    display:flex;
    align-items:center;
    justify-content:center;
}

.btn-copy-all,
.view-toggle-btn{
    background:
        linear-gradient(
            135deg,
            #075CEB,
            #00AFFF
        );

    box-shadow:
        0 7px 20px rgba(0,123,255,.20);
}

.add-market-btn{
    background:
        linear-gradient(
            135deg,
            #0A2D88,
            #007BFF
        );

    border:1px solid rgba(0,174,255,.35);
}

.btn-copy-all:hover,
.view-toggle-btn:hover,
.add-market-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 28px rgba(0,123,255,.35),
        0 0 20px rgba(0,174,255,.20);
}

/* =========================
   SCROLL
========================= */

.scroll-container{
    flex:1;

    overflow-y:auto;

    padding:
        25px
        35px
        70px;

    scroll-behavior:smooth;
}

.scroll-container::-webkit-scrollbar{
    width:5px;
}

.scroll-container::-webkit-scrollbar-track{
    background:transparent;
}

.scroll-container::-webkit-scrollbar-thumb{
    background:
        linear-gradient(
            var(--electric),
            var(--electric2)
        );

    border-radius:20px;
}

/* =========================
   GRID
========================= */

.grid-menu{
    width:100%;
    max-width:1450px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(280px,1fr)
        );

    gap:22px;
}

/* =========================
   CARD
========================= */

.menu-item{
    position:relative;

    padding:17px;

    min-height:175px;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(10,45,136,.65),
            rgba(3,14,35,.88)
        );

    border:1px solid var(--border);

    backdrop-filter:blur(14px);

    box-shadow:var(--shadow);

    display:flex;
    flex-direction:column;

    gap:11px;

    overflow:hidden;

    animation:cardIn .45s ease both;

    transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}

.menu-item::before{
    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--electric2),
            transparent
        );

    opacity:.75;
}

.menu-item::after{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    right:-70px;
    top:-70px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,174,255,.20),
            transparent 70%
        );

    pointer-events:none;
}

.menu-item:hover{
    transform:translateY(-5px);

    border-color:
        rgba(0,174,255,.65);

    box-shadow:
        0 20px 45px rgba(0,0,0,.55),
        0 0 25px rgba(0,123,255,.16);
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   MARKET HEADER
========================= */

.market-header-area{
    display:flex;
    align-items:center;

    gap:8px;

    padding-bottom:9px;

    border-bottom:
        1px solid
        rgba(0,174,255,.14);
}

.market-title{
    flex:1;

    text-align:center;

    color:
        var(--electric2);

    font-family:'Orbitron',sans-serif;

    font-size:17px;
    font-weight:700;

    letter-spacing:1px;

    text-shadow:
        0 0 12px
        rgba(0,174,255,.45);
}

/* =========================
   DELETE
========================= */

.btn-delete-market{
    width:28px;
    height:28px;

    border:1px solid rgba(255,69,69,.12);

    border-radius:7px;

    background:rgba(255,0,0,.03);

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:.35;

    transition:.3s;
}

.menu-item:hover .btn-delete-market{
    opacity:.8;
}

.btn-delete-market:hover{
    opacity:1;

    background:
        rgba(255,69,69,.12);

    border-color:
        rgba(255,69,69,.5);

    box-shadow:
        0 0 12px rgba(255,69,69,.2);
}

.btn-delete-market svg{
    width:14px;
    height:14px;

    fill:none;

    stroke:var(--danger);

    stroke-width:2;
}

/* =========================
   TIME INFO
========================= */

.time-info{
    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:4px 2px;

    font-size:13px;

    font-weight:700;

    letter-spacing:.5px;
}

.time-box{
    display:flex;
    align-items:center;

    gap:5px;
}

.time-ttp{
    color:#ff5757;

    text-shadow:
        0 0 8px rgba(255,69,69,.25);
}

.time-buka{
    color:#00e676;

    text-shadow:
        0 0 8px rgba(0,230,118,.20);
}

.hoki-result{
    width:100%;

    text-align:center;

    padding:5px;

    color:var(--electric2);

    font-weight:800;

    letter-spacing:1px;

    text-shadow:
        0 0 10px rgba(0,174,255,.45);
}

/* =========================
   ACTION BUTTONS
========================= */

.btn-group{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-top:auto;
}

.btn-action{
    height:32px;

    border-radius:7px;

    border:1px solid
        rgba(0,174,255,.25);

    background:
        rgba(255,255,255,.035);

    color:#DCEBFF;

    font-family:'Rajdhani',sans-serif;

    font-size:11px;
    font-weight:800;

    letter-spacing:.5px;

    cursor:pointer;

    transition:.25s;
}

.btn-action:hover{
    background:
        linear-gradient(
            135deg,
            var(--electric),
            var(--electric2)
        );

    color:white;

    border-color:
        var(--electric2);

    box-shadow:
        0 0 15px
        rgba(0,174,255,.35);

    transform:translateY(-1px);
}

/* =========================
   OFFICIAL LINK
========================= */

.btn-direct-link{
    width:100%;

    min-height:30px;

    padding:7px 10px;

    border-radius:7px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    font-family:'Orbitron',sans-serif;

    font-size:9px;
    font-weight:700;

    letter-spacing:1px;

    color:
        var(--electric2);

    background:
        rgba(0,123,255,.06);

    border:
        1px solid
        rgba(0,174,255,.25);

    transition:.3s;
}

.btn-direct-link:hover{
    background:
        linear-gradient(
            135deg,
            var(--electric),
            var(--electric2)
        );

    color:white;

    border-color:
        var(--electric2);

    box-shadow:
        0 0 18px
        rgba(0,174,255,.35);
}

/* =========================
   COMPACT
========================= */

.grid-menu.compact{
    grid-template-columns:1fr;

    gap:10px;
}

.grid-menu.compact .menu-item{
    min-height:auto;

    padding:
        10px 16px;

    display:grid;

    grid-template-columns:
        1.3fr 1.4fr 1.8fr 1.2fr;

    align-items:center;

    gap:15px;
}

.grid-menu.compact .market-header-area{
    border:none;

    padding:0;
}

.grid-menu.compact .market-title{
    text-align:left;

    font-size:15px;
}

.grid-menu.compact .time-info{
    padding:0;
}

.grid-menu.compact .btn-group{
    margin:0;
}

.grid-menu.compact .btn-direct-link{
    margin:0;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
    position:fixed;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,5,15,.78);

    backdrop-filter:
        blur(10px);

    z-index:20000;

    opacity:0;

    pointer-events:none;

    transition:.3s;
}

.modal-overlay.open{
    opacity:1;

    pointer-events:auto;
}

.modal-content{
    width:min(440px,92%);

    padding:25px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(10,45,136,.96),
            rgba(2,12,30,.98)
        );

    border:
        1px solid
        rgba(0,174,255,.55);

    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 35px rgba(0,123,255,.20);

    transform:
        scale(.92)
        translateY(10px);

    transition:.3s;
}

.modal-overlay.open .modal-content{
    transform:
        scale(1)
        translateY(0);
}

.modal-content h3{
    margin-bottom:22px;

    text-align:center;

    color:
        var(--electric2);

    font-family:'Orbitron',sans-serif;

    font-size:17px;

    letter-spacing:2px;

    text-shadow:
        0 0 15px rgba(0,174,255,.4);
}

/* =========================
   FORM
========================= */

.form-group{
    display:flex;
    flex-direction:column;

    gap:6px;

    margin-bottom:15px;
}

.form-group label{
    font-family:'Orbitron',sans-serif;

    font-size:10px;

    color:#8FA9D4;

    letter-spacing:1px;
}

.form-group input{
    width:100%;

    height:40px;

    padding:0 12px;

    border-radius:8px;

    outline:none;

    border:
        1px solid
        rgba(0,174,255,.22);

    background:
        rgba(0,4,15,.55);

    color:white;

    font-family:'Rajdhani',sans-serif;

    font-size:14px;

    font-weight:700;

    transition:.3s;
}

.form-group input:focus{
    border-color:
        var(--electric2);

    box-shadow:
        0 0 15px
        rgba(0,174,255,.15);
}

/* =========================
   MODAL BUTTON
========================= */

.modal-buttons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:22px;
}

.modal-btn{
    height:40px;

    border:none;

    border-radius:8px;

    font-family:'Orbitron',sans-serif;

    font-size:10px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;
}

.modal-btn.save{
    color:white;

    background:
        linear-gradient(
            135deg,
            #075CEB,
            #00AFFF
        );

    box-shadow:
        0 7px 20px
        rgba(0,123,255,.20);
}

.modal-btn.save:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 22px
        rgba(0,174,255,.40);
}

.modal-btn.cancel{
    color:#B8C7E0;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid
        rgba(255,255,255,.10);
}

.modal-btn.cancel:hover{
    background:
        rgba(255,255,255,.10);
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translateX(-50%)
        translateY(20px);

    padding:
        11px 22px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            var(--electric),
            var(--electric2)
        );

    color:white;

    font-family:'Orbitron',sans-serif;

    font-size:10px;

    font-weight:700;

    letter-spacing:.7px;

    z-index:50000;

    opacity:0;

    pointer-events:none;

    box-shadow:
        0 8px 25px
        rgba(0,123,255,.35);

    transition:.3s;
}

#toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
   QUICK BAR
========================= */

.quick-action-bar{
    position:fixed;

    left:18px;
    bottom:12px;

    display:flex;

    flex-direction:column;

    gap:8px;

    z-index:9999;

    padding:6px;

    border-radius:12px;

    background:
        rgba(2,8,20,.68);

    border:
        1px solid
        rgba(0,174,255,.15);

    backdrop-filter:blur(12px);
}

.action-btn{
    width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    text-decoration:none;

    color:
        var(--electric2);

    background:
        rgba(0,123,255,.07);

    border:
        1px solid
        rgba(0,174,255,.30);

    font-size:16px;

    transition:.3s;

    position:relative;
}

.action-btn:hover{
    background:
        var(--electric);

    color:white;

    transform:
        scale(1.08);

    box-shadow:
        0 0 18px
        rgba(0,174,255,.45);
}

.action-btn::after{
    content:attr(data-label);

    position:absolute;

    left:50px;

    top:50%;

    transform:
        translateY(-50%);

    padding:
        6px 10px;

    border-radius:6px;

    background:
        var(--electric);

    color:white;

    font-family:'Orbitron',sans-serif;

    font-size:9px;

    white-space:nowrap;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.action-btn:hover::after{
    opacity:1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    h1{
        font-size:19px;

        letter-spacing:2px;
    }

    .fixed-header{
        padding:
            15px
            12px
            18px;
    }

    .top-row{
        gap:7px;
    }

    .search-box{
        width:100%;
    }

    .btn-copy-all,
    .view-toggle-btn,
    .add-market-btn{
        flex:1;

        padding:
            0 8px;

        font-size:9px;
    }

    .scroll-container{
        padding:
            15px
            12px
            60px;
    }

    .grid-menu{
        grid-template-columns:1fr;

        gap:12px;
    }

    .grid-menu.compact .menu-item{
        display:flex;

        flex-direction:column;

        align-items:stretch;

        gap:9px;
    }

    .grid-menu.compact .market-title{
        text-align:center;
    }

    .grid-menu.compact .time-info{
        justify-content:space-between;
    }

    .quick-action-bar{
        left:8px;
        bottom:8px;
    }
}
</style>
</head>

/* =====================================================
   RANDOM
===================================================== */

function seedRandom(seed){

    let x =
        Math.sin(seed) * 10000;

    return x -
        Math.floor(x);
}


function getPrediction(pName){

    const d = new Date();

    const dateStr =
        d.getFullYear() +
        "" +
        d.getMonth() +
        "" +
        d.getDate();

    let seed = 0;

    const key =
        pName +
        dateStr;

    for(
        let i=0;
        i<key.length;
        i++
    ){

        seed +=
            key.charCodeAt(i);

    }

    const getRnd = (
        min,
        max
    ) =>
        Math.floor(
            seedRandom(seed++) *
            (max-min+1)
        ) + min;


    const getNums = (
        count,
        length
    ) => {

        return Array.from(
            {length:count},
            () =>
                Array.from(
                    {length},
                    () =>
                        getRnd(0,9)
                ).join("")
        ).join(" ");

    };


    return {

        bbfs:
            Array.from(
                {length:7},
                () => getRnd(0,9)
            ).join(""),

        am:
            Array.from(
                {length:5},
                () => getRnd(0,9)
            ).join(""),

        d4:getNums(4,4),

        d3:getNums(4,3),

        d2:getNums(10,2),

        cb:
            getRnd(0,9) +
            "/" +
            getRnd(0,9),

        cb2d:
            getRnd(10,99) +
            "/" +
            getRnd(10,99) +
            "/" +
            getRnd(10,99),

        shio:
            shios[getRnd(0,11)] +
            "/" +
            shios[getRnd(0,11)] +
            "/" +
            shios[getRnd(0,11)],

        twin:
            getRnd(0,9).toString().repeat(2) +
            "/" +
            getRnd(0,9).toString().repeat(2) +
            "/" +
            getRnd(0,9).toString().repeat(2)

    };

}

function executeCopy(
    text,
    successMsg
){

    if(!text)return;


    const textarea =
        document.createElement("textarea");

    textarea.value = text;

    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    textarea.style.top =
        "0";

    document.body.appendChild(
        textarea
    );

    textarea.focus();

    textarea.select();


    try{

        const success =
            document.execCommand("copy");

        if(success){

            showToast(successMsg);

        }else{

            showToast(
                "GAGAL COPY!"
            );

        }

    }catch(error){

        console.error(error);

        showToast(
            "GAGAL COPY!"
        );

    }


    textarea.remove();

}

    const market = {

        b:buka,

        l:link

            closeModal();

            render(
                document.getElementById(
                    "searchInput"
                ).value
            );

            showToast(
                `${name} BERHASIL DIUPDATE!`
            );

            "pasaran_cloud/" +
            newIndex

        .catch(error => {

        render(

        showToast(
            "PASARAN BERHASIL DITAMBAHKAN!"

/* =====================================================
   SECURITY HELPER
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value)
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

   VIEW TOGGLE
===================================================== */

function toggleView(){

    const grid =
        document.getElementById(
            "gridContainer"
        );


    const button =
        document.getElementById(
            "toggleBtn"
        );


    grid.classList.toggle(
        "compact"
    );


    if(
        grid.classList.contains(
            "compact"
        )
    ){

        button.textContent =
            "CARD VIEW";

    }else{

        button.textContent =
            "COMPACT VIEW";

    }

}


/* =====================================================
   CLOSE MODAL CLICK OUTSIDE
===================================================== */

document
    .getElementById(
        "marketModal"
    )
    .addEventListener(
        "click",
        event => {

            if(
                event.target.id ===
                "marketModal"
            ){

                closeModal();

            }

        }
    );


/* =====================================================
   ESC CLOSE MODAL
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);

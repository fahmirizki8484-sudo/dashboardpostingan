<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSTING GENERATOR DASHBOARD</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:#050914;
    color:#fff;
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */
.header{
    padding:15px 25px;
    background:#081026;
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
}

.subtitle{
    font-size:12px;
    color:#8d9bb5;
}

/* =========================
   LAYOUT UTAMA (SIDEBAR + VIEWER)
========================= */
.main-layout{
    display:flex;
    flex:1;
    height:calc(100vh - 60px);
}

/* SIDEBAR KIRI */
.sidebar{
    width:260px;
    background:#070e1e;
    border-right:1px solid rgba(255,255,255,.08);
    padding:20px 15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu-label{
    font-size:11px;
    font-weight:bold;
    color:#6c7d93;
    letter-spacing:1px;
    margin-bottom:5px;
    padding-left:5px;
}

.menu-btn{
    width:100%;
    padding:14px 18px;
    border:none;
    border-radius:10px;
    color:#fff;
    font-size:13px;
    font-weight:800;
    letter-spacing:.5px;
    cursor:pointer;
    text-align:left;
    transition:.2s ease;
    display:flex;
    align-items:center;
    gap:10px;
}

.menu-btn:hover{
    transform:translateX(3px);
}

/* WP */
.wp-btn{
    background:linear-gradient(135deg,#1677c8,#07529c);
}
.wp-btn.active{
    outline:2px solid rgba(55,170,255,.8);
    box-shadow:0 0 20px rgba(0,160,255,.3);
}

/* WA */
.wa-btn{
    background:linear-gradient(135deg,#18c96b,#079447);
}
.wa-btn.active{
    outline:2px solid rgba(40,255,140,.8);
    box-shadow:0 0 20px rgba(0,255,100,.3);
}

/* KONTAN / VIEWER KANAN */
.viewer-container{
    flex:1;
    position:relative;
    background:#fff;
    overflow:hidden;
}

#generatorFrame{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#fff;
}

/* LOADING */
.loading{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:15px;
    background:#07101d;
    z-index:10;
}

.loading.show{
    display:flex;
}

.spinner{
    width:40px;
    height:40px;
    border:4px solid rgba(255,255,255,.12);
    border-top-color:#00aaff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.loading-text{
    font-size:13px;
    color:#9ba9bf;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

/* RESPONSIF HP */
@media(max-width:768px){
    .main-layout{
        flex-direction:column;
        height:auto;
    }
    .sidebar{
        width:100%;
        flex-direction:row;
        gap:8px;
        padding:10px;
    }
    .menu-label{
        display:none;
    }
    .menu-btn{
        flex:1;
        text-align:center;
        justify-content:center;
        padding:12px 8px;
        font-size:12px;
    }
    .viewer-container{
        height:calc(100vh - 125px);
        min-height:500px;
    }
}
</style>
</head>
<body>

<header class="header">
    <div class="logo">POSTING GENERATOR</div>
    <div class="subtitle">Dashboard WP & WA</div>
</header>

<div class="main-layout">
    <!-- SIDEBAR KIRI -->
    <div class="sidebar">
        <div class="menu-label">MENU UTAMA</div>
        
        <button class="menu-btn wp-btn active" onclick="openGenerator('generator-wp.html', this)">
            <span>📝</span> GENERATOR WP
        </button>

        <button class="menu-btn wa-btn" onclick="openGenerator('generator-wa.html', this)">
            <span>💬</span> GENERATOR WA
        </button>
    </div>

    <!-- VIEWER KANAN -->
    <main class="viewer-container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Memuat generator...</div>
        </div>

        <iframe id="generatorFrame" src="generator-wp.html" title="Posting Generator"></iframe>
    </main>
</div>

<script>
function openGenerator(file, button){
    const frame = document.getElementById("generatorFrame");
    const loading = document.getElementById("loading");

    loading.classList.add("show");

    document.querySelectorAll(".menu-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");
    frame.src = file;
}

document.getElementById("generatorFrame").addEventListener("load", function(){
    document.getElementById("loading").classList.remove("show");
});

document.addEventListener("keydown", function(e){
    if(e.altKey && e.key === "1"){
        document.querySelector(".wp-btn").click();
    }
    if(e.altKey && e.key === "2"){
        document.querySelector(".wa-btn").click();
    }
});
</script>

</body>
</html>
